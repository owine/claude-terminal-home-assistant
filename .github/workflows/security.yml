name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 9am UTC (aligns with Renovate schedule)
    - cron: "0 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  filesystem-scan:
    name: Filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Advisory: never blocks merges. Findings are surfaced in the job summary, and
      # non-PR runs (push to main / weekly schedule) open a tracking issue. Renovate
      # remediates most direct-dependency findings on its own, but not all of them —
      # transitive deps held back by an upstream version cap need a manual decision,
      # so triage the issue rather than assuming it self-resolves.
      - name: Run Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: .trivy.yaml
          # Required: Trivy only auto-discovers the plain `.trivyignore` name, so
          # the scoped YAML ignore list must be passed explicitly or it is ignored
          # silently and every suppressed CVE comes back.
          trivyignores: .trivyignore.yaml
          cache: "false"
          format: table
          output: trivy-fs-results.txt

      # Cap the report so large result sets don't blow past the job-summary (1 MiB)
      # or issue-body (64 KiB) limits. Used by both the summary and the issue.
      - name: Prepare findings report
        if: steps.trivy.outcome == 'failure'
        run: |
          max=500
          {
            head -n "$max" trivy-fs-results.txt
            if [ "$(wc -l < trivy-fs-results.txt)" -gt "$max" ]; then
              echo "... (truncated at ${max} lines; see the workflow logs for the full output)"
            fi
          } > trivy-report.txt

      - name: Publish results to job summary
        if: always()
        env:
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          {
            echo "## Trivy filesystem scan"
            if [ "$TRIVY_OUTCOME" = "failure" ]; then
              echo "### ⚠️ CRITICAL/HIGH fixable findings"
              echo ""
              echo '```'
              cat trivy-report.txt || true
              echo '```'
            else
              echo "✅ No CRITICAL/HIGH fixable vulnerabilities found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue on findings
        if: steps.trivy.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="🔒 Trivy filesystem scan: fixable vulnerabilities detected"
          {
            echo "The Trivy filesystem scan found CRITICAL/HIGH vulnerabilities with fixes available."
            echo ""
            echo "**This needs triage — it does not always resolve on its own.** Renovate opens"
            echo "security PRs for most direct-dependency findings, and this issue clears once such"
            echo "a PR merges. But it cannot fix a transitive dependency that an upstream package"
            echo "caps below the fixed version: the lockfile simply resolves back to the vulnerable"
            echo "release. Those need an upstream release, or a scoped and documented entry in"
            echo "\`.trivyignore.yaml\` recording why the CVE is unfixable here and when to prune it."
            echo ""
            echo "Nothing closes this issue automatically — close it once the finding is resolved."
            echo ""
            echo "<details><summary>Scan output</summary>"
            echo ""
            echo '```'
            cat trivy-report.txt || true
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "_Source run: ${RUN_URL}_"
          } > issue-body.md
          gh label create security --color D93F0B --description "Security issues and updates" --force >/dev/null 2>&1 || true
          # Tolerate transient API failures (advisory job) and match the title exactly.
          existing=$(gh issue list --label security --state open --json number,title 2>/dev/null \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty' || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "$title" --label security --body-file issue-body.md
          fi
