# OPTIONAL WORKFLOW: Claude Code Comment Automation
#
# This workflow enables AI-assisted development by responding to @claude mentions
# in GitHub issues, pull requests, and comments.
#
# How it works:
# 1. User mentions @claude in an issue or PR comment
# 2. Claude Code CLI analyzes the context (code, issue, PR diff)
# 3. Claude responds with suggestions, code fixes, or answers
#
# Requirements:
# - CLAUDE_CODE_OAUTH_TOKEN secret configured in repository settings
# - Active Claude Code subscription
#
# This is NOT required for the app to function. It's a development productivity
# tool that can be disabled without affecting the core project.
#
# See: https://github.com/anthropics/claude-code-action

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-26.04
    # SECURITY — these permissions are read-only on purpose. The job holds
    # CLAUDE_CODE_OAUTH_TOKEN and id-token: write, so on a fork PR it must not
    # also be able to push code or write comments with the workflow token. Do
    # not add contents: write / pull-requests: write here.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # SECURITY — fork-PR safety rests on two properties of this action,
        # verified at the pinned SHA (2026-11-06 audit):
        #   1. it runs only for an actor with repo write access
        #      (permissions.ts); do NOT set allowed_non_write_users, which
        #      bypasses that check, or a fork author could trigger a run.
        #   2. after checking out a PR head it restores .claude/, .mcp.json,
        #      .claude.json, CLAUDE.md etc. from the reviewed base branch
        #      (restore-config.ts) before launching, so PR-controlled hooks and
        #      MCP servers do not execute.
        # Keep any base-branch .claude/ hooks self-contained (call the tool
        # binary directly; no `npm run`/Makefile indirection a PR could edit).
        # Re-check both if this action is bumped to a version that changes the
        # base-restore behaviour.
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If not specified, Claude
          # will perform the instructions from the comment that tagged it.
          # prompt: 'Update the PR description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'
