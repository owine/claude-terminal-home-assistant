name: Test

on:
  push:
    branches: [main]
    paths:
      - 'claude-terminal/**'
      - '.github/workflows/test.yml'
  # Run on every PR (no paths filter): the branch ruleset requires
  # `Test build amd64` and `Test build aarch64` to pass, so a PR that doesn't
  # touch the filtered paths would leave them expected-but-missing and
  # permanently block merge.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: claude-terminal-prowine
  # docker/build-push-action (wrapped by the HA builder action) uploads a
  # .dockerbuild build record as a workflow artifact on every build. They are
  # never read, two are produced per run, and they sit for the 90-day default
  # retention -- 673 of them had accumulated. Job-level env reaches composite
  # action steps, so this switches them off at the source.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Test build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./claude-terminal
          cosign: "false"
          image: ${{ matrix.image }}
          image-tags: |
            test
          load: "true"
          push: "false"
          version: ${{ github.sha }}

      - name: Smoke test
        env:
          IMAGE: ${{ matrix.image }}:test
        run: |
          set -euo pipefail

          # Start container with a fake Supervisor token.
          # bashio::config returns its default argument when the Supervisor API
          # is unreachable, so startup proceeds with sane defaults.
          docker run -d \
            --name smoke-test \
            -p 7680:7680 \
            -p 7681:7681 \
            -e SUPERVISOR_TOKEN=smoke-test-fake-token \
            "$IMAGE"

          # Poll until ttyd (7681) and wrapper (7680) both respond, or timeout.
          echo "Waiting for services to start (up to 60s)..."
          READY=false
          for i in $(seq 1 30); do
            if curl -sf --max-time 2 http://localhost:7681/ > /dev/null 2>&1 && \
               curl -sf --max-time 2 http://localhost:7680/ > /dev/null 2>&1; then
              echo "Services ready after $((i * 2))s"
              READY=true
              break
            fi
            # Bail early if the container crashed
            if ! docker ps -q --filter name=smoke-test | grep -q .; then
              echo "Container exited unexpectedly"
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "ERROR: Services did not become ready within 60s"
            exit 1
          fi

          # Verify ttyd returns HTTP 200 — proves ttyd started and exec'd its command
          TTYD_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7681/)
          [ "$TTYD_CODE" = "200" ] || { echo "ERROR: ttyd returned HTTP $TTYD_CODE"; exit 1; }
          echo "ttyd endpoint: HTTP $TTYD_CODE"

          # Verify wrapper returns HTTP 200 — proves the Node service started
          WRAP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7680/)
          [ "$WRAP_CODE" = "200" ] || { echo "ERROR: wrapper returned HTTP $WRAP_CODE"; exit 1; }
          echo "Wrapper endpoint: HTTP $WRAP_CODE"

          echo "Smoke test passed"

      # Everything below is amd64-only: the integration test drives real browser
      # engines against the running container, and Playwright's WebKit build is
      # not available for the aarch64 runner. The aarch64 job keeps the smoke
      # test, which is what it is there to prove.
      - name: Set up Node
        if: matrix.arch == 'amd64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1' # renovate: datasource=node-version depName=node-lts-24 packageName=node
          cache: npm
          cache-dependency-path: claude-terminal/wrapper/package-lock.json

      # Covers the wiring between browser, xterm.js, ttyd and tmux that the unit
      # tests cannot see. Every mouse and clipboard bug in 2.7.0-2.7.4 lived
      # there and passed CI; this is what closes that hole. Reuses the container
      # the smoke test already started and health-checked, so there is no second
      # build and no second startup wait.
      # Playwright is deliberately not a devDependency (see the test header), so
      # install it out-of-tree. Pinning the version here is what makes the
      # browser cache below correct: the cache key has to change when the
      # browsers do, and Playwright's binaries are tied to its version.
      - name: Install Playwright
        if: matrix.arch == 'amd64'
        id: playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw
          npm --prefix /tmp/pw install --no-save --no-package-lock playwright@"${PLAYWRIGHT_VERSION}"
          echo "version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
        env:
          PLAYWRIGHT_VERSION: '1.62.1' # renovate: datasource=npm depName=playwright

      # Browser binaries are ~400MB and were re-downloaded on every run. The key
      # is the Playwright version, not the lockfile: nothing else changes them,
      # so there is exactly one entry per version rather than one per branch or
      # per commit. GitHub evicts caches untouched for 7 days, so entries for old
      # Playwright versions clear themselves once Renovate bumps the pin.
      - name: Cache Playwright browsers
        if: matrix.arch == 'amd64'
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # --with-deps installs apt packages, which live outside the cached path and
      # so must run either way; it is fast when the packages are already present.
      # Only the browser download is skipped on a cache hit.
      - name: Install browsers
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            /tmp/pw/node_modules/.bin/playwright install-deps chromium webkit
          else
            /tmp/pw/node_modules/.bin/playwright install --with-deps chromium webkit
          fi

      - name: Integration test (browser to tmux wiring)
        if: matrix.arch == 'amd64'
        env:
          CTP_CONTAINER: smoke-test
          CTP_URL: http://localhost:7680/
        run: |
          set -euo pipefail

          # The ingress harness imports http-proxy-middleware, resolved from the
          # wrapper's own node_modules, so these are required to even load the
          # test - not just to run the server.
          npm --prefix claude-terminal/wrapper ci --omit=dev

          CTP_PLAYWRIGHT=/tmp/pw/node_modules/playwright/index.mjs \
            node claude-terminal/wrapper/test/integration/mouse-and-clipboard.mjs

      # A failing browser test is opaque without the other side of the wiring.
      - name: Integration test diagnostics
        if: failure() && matrix.arch == 'amd64'
        run: |
          echo "=== container logs (tail) ==="
          docker logs smoke-test 2>&1 | tail -80 || true
          echo "=== tmux state ==="
          docker exec smoke-test tmux display -p \
            'mouse=#{mouse} in_mode=#{pane_in_mode} scroll=#{scroll_position} history=#{history_size} cmd=#{pane_current_command}' || true

      # The tmux side alone rarely explains a browser failure. The test writes a
      # screenshot and the page's console output for each combination that
      # failed, and only for those - a green run uploads nothing.
      - name: Upload browser artifacts
        if: failure() && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-failure-artifacts
          path: claude-terminal/wrapper/test/integration/artifacts/
          if-no-files-found: ignore
          # Long enough to debug the PR that produced them, short enough that
          # failed runs do not accumulate screenshots for months.
          retention-days: 3

      - name: Show container logs
        if: always()
        run: docker logs smoke-test 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker stop smoke-test 2>/dev/null || true
          docker rm smoke-test 2>/dev/null || true
