name: Publish

on:
  release:
    types: [published]

env:
  # docker/build-push-action (wrapped by the HA builder action) uploads a
  # .dockerbuild build record as a workflow artifact on every build. They are
  # never read, two are produced per run, and they sit for the 90-day default
  # retention -- 673 of them had accumulated. Job-level env reaches composite
  # action steps, so this switches them off at the source.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: claude-terminal-prowine

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from release tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    # Runner labels for these matrix jobs are not ours to pin. `matrix.os`
    # comes from home-assistant/builder's prepare-multi-arch-matrix in the
    # `init` job, which is fed only `architectures` and `image-name` and picks
    # the labels itself -- including the `-arm` suffixed label for aarch64,
    # a form that appears nowhere in this repo. So an Ubuntu bump for these
    # jobs arrives inside an ordinary action-digest bump for the builder, with
    # no mention of Ubuntu in the diff. Renovate cannot cover them either: the
    # shared preset's github-runners customManager keys on a literal
    # `runs-on:` value, and there is none here to key on. Don't add a literal
    # label to "fix" that -- it would break the arch/runner pairing.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./claude-terminal
          # Rebuild the apk layer (and everything after it) on every release,
          # so transitive Alpine packages get their security fixes. See
          # APK_REFRESH in the Dockerfile.
          build-args: |
            APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cosign: "true"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  # Supervisor reads config.yaml straight from main, so its version bump is
  # what makes a release visible to Home Assistant. release-please used to
  # make that bump in the Release PR, which offered HA users an update whose
  # image was still building -- or, if a build failed, never arrived. It lands
  # here instead, once the multi-arch manifest exists. Not gated on image-scan:
  # its usual failures are Go-binary CVEs we cannot fix quickly, and holding
  # back a release for those would hold back its fixes too.
  #
  # Supervisor also shows CHANGELOG.md to users, so the release notes (the
  # published release's body, drafted by release-drafter) are prepended to it
  # in the same commit: HA never sees a version without its changelog.
  #
  # The release app is a bypass actor on the "main protection" ruleset, so it
  # commits to main directly. createCommitOnBranch (not git push) makes GitHub
  # sign the commit, and expectedHeadOid makes a concurrent push to main fail
  # the commit instead of being overwritten. The chore: type is pre-excluded
  # from release-drafter's notes, so the commit never shows up in a release.
  promote:
    name: Publish version to Home Assistant
    needs: [init, manifest]
    runs-on: ubuntu-26.04
    # The app's secrets live in the "release" environment, which hands them
    # only to jobs running on main or a v* tag -- a workflow edited on any
    # other branch cannot mint the token. A release: published run is on its
    # v* tag, so it qualifies. deployment: false skips the deployment record
    # GitHub would otherwise log on every run.
    environment:
      name: release
      deployment: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Bump config.yaml version and CHANGELOG.md on main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.init.outputs.version }}
          TAG_SHA: ${{ github.sha }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          CONFIG: claude-terminal/config.yaml
          CHANGELOG: claude-terminal/CHANGELOG.md
        run: |
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$VERSION" =~ $semver ]]; then
            echo "::error::release tag gives version '$VERSION', expected X.Y.Z"
            exit 1
          fi
          # Read everything at one main commit; the commit below is made
          # against that same commit or not at all.
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          # A release can be cut by hand on any commit, but only reviewed code
          # may reach HA: the tagged commit must already be on main.
          status=$(gh api "repos/$REPO/compare/$TAG_SHA...$head" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "::error::release commit $TAG_SHA is not on main ($status); not promoting"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          raw=(-H "Accept: application/vnd.github.raw")
          gh api "${raw[@]}" "repos/$REPO/contents/$CONFIG?ref=$head" > config.yaml
          current=$(sed -nE 's/^version: "([^"]+)".*/\1/p' config.yaml)
          if ! [[ "$current" =~ $semver ]]; then
            echo "::error::no 'version: \"X.Y.Z\"' line in $CONFIG (got '$current')"
            exit 1
          fi
          # Only ever move forward: re-running an older release's publish must
          # not roll HA users back to it, nor add its notes to the changelog
          # a second time.
          newest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)
          if [ "$current" = "$VERSION" ] || [ "$newest" != "$VERSION" ]; then
            echo "::notice::config.yaml is at $current; leaving it and $CHANGELOG (release $VERSION)"
            exit 0
          fi
          sed -i -E "s/^version: \"[^\"]+\"/version: \"$VERSION\"/" config.yaml

          gh api "${raw[@]}" "repos/$REPO/contents/$CHANGELOG?ref=$head" > CHANGELOG.md
          if [ "$(head -n1 CHANGELOG.md)" != "# Changelog" ]; then
            echo "::error::$CHANGELOG does not start with '# Changelog'"
            exit 1
          fi
          # The notes cover the range since the previous published release,
          # which is what release-drafter drafted them against.
          prev=$(gh api --paginate "repos/$REPO/releases" \
              --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' |
            sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | sort -uV |
            awk -v v="$VERSION" '$0 == v { prev = p } { p = $0 } END { print prev }')
          if [ -z "$prev" ]; then
            echo "::error::no published release before v$VERSION to compare against"
            exit 1
          fi
          if [ "$prev" != "$current" ]; then
            echo "::warning::HA is moving from $current, but these notes only cover $prev...$VERSION"
          fi
          # The body is read from the event file, not passed through env: Linux
          # caps one environment string at 128 KiB, and a body past that would
          # keep the shell from starting at all.
          # Match the existing (release-please era) entries: categories one
          # level below the version heading, and PR numbers as links, since
          # neither HA nor GitHub's file view autolinks #123. Every number in
          # an entry's trailing list is linked, so a grouped "(#486, #490)"
          # gets two. Each pass links the leftmost number that only the rest
          # of that list follows, so "#12" or "(#12)" in the title is left
          # alone. The collapsed
          # <details> wrapper and the "Full changelog" line are dropped (the
          # version heading already links the compare view), and cat -s
          # squeezes the blank lines that leaves. The link rule uses @ as its
          # delimiter because $REPO is owner/name.
          # $(...) drops the trailing blank lines the deletions leave, so one
          # blank line separates the notes from the previous entry.
          body=$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | tr -d '\r' |
            sed -E -e 's/^(#+ )/#\1/' \
              -e '/^<\/?details>$/d' -e '/^<summary>.*<\/summary>$/d' \
              -e '/^\*\*Full changelog:\*\*/d' \
              -e '/^- .*\(#[0-9]+(, #[0-9]+)*\)$/{' -e ':a' \
              -e 's@([(]|, )#([0-9]+)((, #[0-9]+)*\))$@\1[#\2](https://github.com/'"$REPO"'/issues/\2)\3@' \
              -e 'ta' -e '}' | cat -s)
          {
            echo "# Changelog"
            echo
            echo "## [$VERSION](https://github.com/$REPO/compare/v$prev...v$VERSION) (${PUBLISHED_AT%%T*})"
            echo
            printf '%s\n' "$body"
            echo
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          jq -n \
            --arg repo "$REPO" \
            --arg head "$head" \
            --arg headline "chore: publish $VERSION to Home Assistant" \
            --arg config_path "$CONFIG" \
            --rawfile config <(base64 -w0 config.yaml) \
            --arg changelog_path "$CHANGELOG" \
            --rawfile changelog <(base64 -w0 CHANGELOG.md) \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid } } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                expectedHeadOid: $head,
                message: { headline: $headline },
                fileChanges: { additions: [
                  { path: $config_path, contents: $config },
                  { path: $changelog_path, contents: $changelog }
                ] }
              } }
            }' > commit.json
          gh api graphql --input commit.json \
            --jq '.data.createCommitOnBranch.commit | "Committed " + .oid + " (verified: " + (.signature.isValid | tostring) + ")"'

  image-scan:
    name: Scan ${{ matrix.platform }} image
    needs: [init, manifest]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      # OCI platforms mirror the build ARCHITECTURES (amd64->linux/amd64, aarch64->linux/arm64); keep in sync
      matrix:
        platform: ["linux/amd64", "linux/arm64"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: "ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.init.outputs.version }}"
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: "1"
          scanners: vuln
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          cache: "false"
