<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
    <title>Claude Terminal Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            touch-action: manipulation;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: var(--app-height, 100vh);
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: var(--app-height, 100vh);
        }

        #header {
            background: #2d2d2d;
            padding: 8px 12px;
            border-bottom: 1px solid #3d3d3d;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .header-btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-btn:hover {
            background: #005a9e;
        }

        .header-btn:active {
            background: #004578;
        }

        .header-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #voice-btn.recording {
            background: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #status {
            font-size: 12px;
            color: #888;
            padding: 0 12px;
            transition: all 0.2s ease;
        }

        /* Available to assistive technology, absent from the visual layout.
           clip-rect rather than display:none or visibility:hidden, both of
           which remove the element from the accessibility tree entirely. */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Clipboard button. Replaces the status-text notification for copies:
           that text auto-cleared after five seconds, so a copy the user was not
           looking at vanished with no trace. An indicator persists until it is
           acknowledged. */
        #clipboard-btn {
            position: relative;
        }

        #clipboard-badge {
            display: none;
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ec9b0;
            box-shadow: 0 0 0 2px #007acc;
        }

        #clipboard-btn.has-copy #clipboard-badge {
            display: block;
        }

        /* One-shot flash on arrival, so a copy is noticeable without stealing
           focus. The class is removed on animationend; the badge is what
           persists. */
        #clipboard-btn.flash {
            animation: clipboard-flash 0.45s ease-in-out 2;
        }

        @keyframes clipboard-flash {
            0%, 100% { background: #007acc; }
            50%      { background: #4ec9b0; }
        }

        /* Honour a reduced-motion preference: keep the badge, drop the pulse. */
        @media (prefers-reduced-motion: reduce) {
            #clipboard-btn.flash { animation: none; }
        }

        #status.success {
            color: #4ec9b0;
        }

        #status.error {
            color: #f48771;
        }

        #status:hover {
            opacity: 0.8;
        }


        #terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #1e1e1e;
            touch-action: auto;
        }

        /* Touch scroll overlay — captures touch events on iOS where
           iframes don't forward them. Always active on touch devices.
           Swipes are converted to terminal scroll. Taps trigger focus
           on xterm's hidden textarea to open the iOS keyboard. */
        #touch-scroll-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            touch-action: none;
        }

        @media (pointer: coarse) {
            #touch-scroll-overlay {
                display: block;
            }
        }

        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 122, 204, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
        }

        #drop-zone-text {
            font-size: 24px;
            font-weight: 500;
            color: white;
            text-align: center;
        }

        #file-input {
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Voice Modal */
        #voice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #voice-modal.active {
            display: flex;
        }

        #voice-modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3d3d3d;
        }

        #voice-modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #fff;
        }

        #voice-transcript {
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
        }

        #voice-transcript.listening {
            border-color: #d9534f;
        }

        #voice-transcript:empty::before {
            content: "Click 'Start Recording' and speak...";
            color: #666;
            font-style: italic;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .modal-btn-primary {
            background: #007acc;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #005a9e;
        }

        .modal-btn-danger {
            background: #d9534f;
            color: white;
        }

        .modal-btn-danger:hover {
            background: #c9302c;
        }

        .modal-btn-secondary {
            background: #555;
            color: white;
        }

        .modal-btn-secondary:hover {
            background: #666;
        }

        #voice-status {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            min-height: 18px;
        }

        #voice-status.listening {
            color: #d9534f;
        }

        /* Terminal Control Buttons */
        .ctrl-btn {
            background: #3d3d3d;
            color: #ccc;
            border: 1px solid #555;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'SF Mono', 'Consolas', 'Liberation Mono', monospace;
            min-width: 32px;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        .ctrl-btn:hover {
            background: #4d4d4d;
            border-color: #666;
        }

        .ctrl-btn:active {
            background: #007acc;
            border-color: #007acc;
            color: white;
        }

        #paste-input {
            background: #1e1e1e;
            color: #ccc;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 12px;
            font-family: 'SF Mono', 'Consolas', 'Liberation Mono', monospace;
            flex: 1;
            min-width: 80px;
        }

        #paste-input::placeholder {
            color: #666;
        }

        #paste-input:focus {
            outline: none;
            border-color: #007acc;
        }

        #send-btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            flex-shrink: 0;
        }

        #send-btn:hover {
            background: #005a9e;
        }

        #send-btn:active {
            background: #004578;
        }

        #login-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #252526;
            border-bottom: 1px solid #007acc;
            flex-wrap: wrap;
        }
        #login-banner[hidden] { display: none; }
        #login-banner-msg { color: #cccccc; font-size: 13px; margin-right: 4px; }
        .login-btn {
            background: #007acc; color: #fff; border: none; border-radius: 4px;
            padding: 4px 12px; font-size: 13px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center;
        }
        .login-btn:hover { background: #005a9e; }
        .login-btn-subtle { background: #3c3c3c; }
        .login-btn-subtle:hover { background: #4a4a4a; }
        .login-paste {
            flex: 1 1 200px; min-width: 140px; padding: 4px 8px;
            background: #1e1e1e; color: #d4d4d4; border: 1px solid #3c3c3c; border-radius: 4px;
        }
        .login-paste[hidden], .login-btn[hidden] { display: none; }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <!-- Terminal control buttons -->
            <button class="ctrl-btn" data-input="\x03" title="Ctrl+C (Interrupt)">^C</button>
            <button class="ctrl-btn" data-input="\x09" title="Tab (Autocomplete)">Tab</button>
            <button class="ctrl-btn" data-input="\x1b" title="Escape">Esc</button>
            <button class="ctrl-btn" data-input="\x1b[D" title="Left Arrow">&larr;</button>
            <button class="ctrl-btn" data-input="\x1b[A" title="Up Arrow">&uarr;</button>
            <button class="ctrl-btn" data-input="\x1b[B" title="Down Arrow">&darr;</button>
            <button class="ctrl-btn" data-input="\x1b[C" title="Right Arrow">&rarr;</button>
            <button class="ctrl-btn" data-input="\r" title="Enter / Return">Enter</button>

            <!-- Paste input bar -->
            <input type="text" id="paste-input" placeholder="Type or paste here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
            <button id="send-btn" title="Send to terminal">&#9166;</button>

            <!-- Status and existing buttons -->
            <span id="term-indicator" style="width: 8px; height: 8px; border-radius: 50%; background: #f48771; flex-shrink: 0;" title="Terminal loading..."></span>
            <span id="status"></span>
            <button id="clipboard-btn" class="header-btn" title="Nothing copied yet"
                    aria-label="Clipboard: nothing copied yet">
                <span aria-hidden="true">&#128203;</span>
                <span id="clipboard-badge" aria-hidden="true"></span>
            </button>
            <!-- The badge and the flash are both visual only, so the arrival of
                 a copy would otherwise be undetectable without sight. A polite
                 live region announces it without stealing focus mid-task. It is
                 separate from the button because changing a focused element's
                 own label is not reliably re-announced. -->
            <span id="clipboard-announcer" class="sr-only" role="status" aria-live="polite"></span>
            <button id="voice-btn" class="header-btn" title="Voice Input">
                <span>&#127908;</span>
            </button>
            <button id="upload-btn" class="header-btn" title="Upload Image">
                <span>&#128206;</span>
            </button>
        </div>
        <div id="login-banner" hidden>
            <span id="login-banner-icon">&#128273;</span>
            <span id="login-banner-msg">Login link ready</span>
            <a id="login-open" class="login-btn" target="_blank" rel="noopener">Open</a>
            <button id="login-copy" class="login-btn" type="button">Copy</button>
            <input id="login-paste" class="login-paste" type="text"
                   placeholder="Paste your authentication code"
                   autocomplete="off" autocorrect="off" autocapitalize="off"
                   spellcheck="false" enterkeyhint="send" hidden>
            <button id="login-send" class="login-btn" type="button" hidden>Send</button>
            <button id="login-rescan" class="login-btn login-btn-subtle" type="button"
                    title="Scan the terminal for a login link">Scan</button>
            <button id="login-dismiss" class="login-btn login-btn-subtle" type="button"
                    title="Dismiss">&times;</button>
        </div>
        <div id="terminal-container">
            <iframe id="terminal-frame" src="about:blank"></iframe>
            <div id="touch-scroll-overlay"></div>
            <div id="drop-zone">
                <div id="drop-zone-text">Drop image here to upload</div>
            </div>
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <!-- Voice Input Modal -->
    <div id="voice-modal">
        <div id="voice-modal-content">
            <div id="voice-modal-title">🎤 Voice Input</div>
            <div id="voice-status"></div>
            <div id="voice-transcript" contenteditable="true"></div>
            <div class="modal-buttons">
                <button id="voice-record-btn" class="modal-btn modal-btn-danger">Start Recording</button>
                <button id="voice-send-btn" class="modal-btn modal-btn-primary" style="display: none;">Send to Terminal</button>
                <button id="voice-copy-btn" class="modal-btn modal-btn-secondary" style="display: none;">Copy Text</button>
                <button id="voice-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script src="login-link.js"></script>
    <script src="terminal-clipboard.js"></script>
    <script>
        let ttydPort = 7681;
        let uploadDir = '/data/images';

        // Fetch configuration and load ttyd
        // Use relative paths for Home Assistant ingress compatibility
        fetch('config')
            .then(res => res.json())
            .then(config => {
                ttydPort = config.ttydPort;
                uploadDir = config.uploadDir;
                console.log('Config loaded:', config);
                // Load ttyd via proxy endpoint
                loadTerminal();
            })
            .catch(err => {
                console.error('Failed to load config:', err);
                // Fallback: load terminal anyway
                loadTerminal();
            });

        function loadTerminal() {
            const iframe = document.getElementById('terminal-frame');
            // Use relative path for Home Assistant ingress compatibility
            iframe.src = 'terminal/';

            // Poll for xterm.js term instance to be ready in the iframe
            iframe.addEventListener('load', () => {
                let termFound = false;
                const checkTerm = setInterval(() => {
                    try {
                        if (iframe.contentWindow?.term) {
                            clearInterval(checkTerm);
                            termFound = true;
                            const indicator = document.getElementById('term-indicator');
                            indicator.style.background = '#4ec9b0';
                            indicator.title = 'Terminal ready';
                            registerTerminalHandlers(iframe.contentWindow.term);
                        }
                    } catch (e) {
                        // iframe not accessible yet
                    }
                }, 500);
                // Stop polling after 30s. Say so if we gave up: without the
                // terminal instance the mouse handlers were never registered,
                // so text selection in full-screen apps is unprotected.
                setTimeout(() => {
                    clearInterval(checkTerm);
                    if (!termFound) {
                        console.error('[wrapper] terminal instance never appeared; handlers not registered');
                        setStatus('Terminal did not finish loading — reload the page', 'error');
                    }
                }, 30000);
            });
        }

        // ========================================
        // Terminal wiring — tmux owns the mouse
        // ========================================
        //
        // The browser makes no decision about mouse reporting. tmux does,
        // via its `mouse` option, and xterm simply honours the DECSET that
        // arrives on the PTY.
        //
        // This used to be a negotiation: the wrapper vetoed applications'
        // DECSET requests so text selection kept working, then reconciled the
        // result against a flag driven by an HTTP endpoint. Those two inputs
        // travelled over unordered transports and raced, which wedged mouse
        // mode until a page reload across three releases. Selection while
        // reporting is on is now xterm's own job — see FORCE_SELECTION below.
        //
        // All that is left here is registering the OSC 52 handler, because
        // ttyd 1.7.7 has none and would otherwise discard clipboard writes.

        // Marks a term instance as already wired. A Symbol rather than a string
        // key so it cannot collide with xterm.js internals or another add-on.
        const HANDLERS_REGISTERED = Symbol('wrapperTerminalHandlers');

        function registerTerminalHandlers(term) {
            // The guard lives on the terminal INSTANCE, not on this page. The
            // iframe reloads (ttyd reconnect, PWA update) and hands us a fresh
            // `term` with no handlers; a page-scoped flag would still be set and
            // would silently leave clipboard writes unhandled for the rest of
            // the session. Parser handlers survive terminal.reset(), so one
            // registration per instance is enough.
            if (term[HANDLERS_REGISTERED]) return;

            // terminal-clipboard.js can fail to load (404 mid-rollout, wrapper
            // restart). Check here rather than discovering it inside a handler.
            if (!window.TerminalClipboard) {
                console.error('[wrapper] terminal-clipboard.js did not load');
                setStatus('Clipboard copies from the terminal will not work', 'error');
                return;
            }

            try {
                // Let a held modifier force xterm's own selection even while an
                // application has mouse reporting on. On macOS that is Option
                // and it requires this option; every other platform uses Shift
                // and gets it unconditionally. This single line replaces the
                // entire DECSET veto that used to live here.
                term.options.macOptionClickForcesSelection = true;

                // Guarded because an exception thrown out of a parser handler
                // escapes xterm's write pipeline from a timer callback — it
                // cannot be caught by the term.write() caller and it stops
                // terminal output entirely. Our own bug must never do that.
                term.parser.registerOscHandler(52, (data) => {
                    try {
                        const result = window.TerminalClipboard.decodeOsc52(data);
                        if (result.kind === 'write') {
                            putOnClipboard(result.text)
                                .catch((e) => console.error('[wrapper] clipboard:', e));
                        } else if (result.kind === 'oversize') {
                            setStatus('Copy too large for the browser clipboard', 'error');
                        } else if (result.kind === 'invalid') {
                            console.warn('[wrapper] malformed OSC 52 payload');
                        }
                        // 'read' stays silent deliberately — it is refused
                        // because proxying it would leak the user's clipboard to
                        // any process on the PTY, and advertising the refusal
                        // just spams the status bar.
                    } catch (e) {
                        console.error('[wrapper] OSC 52 handling failed:', e);
                    }
                    return true;    // consumed either way; xterm has no handler
                });

                term[HANDLERS_REGISTERED] = true;
            } catch (e) {
                // No silent no-ops: if clipboard delivery is not wired up, a
                // copy inside the terminal will vanish with no explanation.
                console.error('[wrapper] terminal handler registration failed:', e);
                setStatus('Clipboard copies from the terminal will not work', 'error');
            }
        }

        // ========================================
        // Terminal Input via iframe term API
        // ========================================

        // Send raw input to the terminal via the iframe's xterm.js instance.
        // Uses triggerDataEvent(data, false) to bypass bracket paste mode,
        // so control characters like \x03 (Ctrl+C) are sent raw.
        function sendInput(data) {
            const iframe = document.getElementById('terminal-frame');
            try {
                const term = iframe.contentWindow?.term;
                if (!term) {
                    setStatus('Terminal loading...', 'error');
                    return false;
                }
                term._core.coreService.triggerDataEvent(data, false);
                return true;
            } catch (e) {
                console.error('sendInput failed:', e);
                setStatus('Cannot send to terminal', 'error');
                return false;
            }
        }

        // Auto-inject text into terminal, with clipboard fallback
        function injectIntoTerminal(text) {
            if (sendInput(text)) {
                setStatus('Sent to terminal: ' + text, 'success');
                return true;
            }
            return false;
        }

        // ========================================
        // Control Buttons
        // ========================================

        const INPUT_MAP = {
            '\\x03': '\x03',  // Ctrl+C
            '\\x09': '\x09',  // Tab
            '\\x1b': '\x1b',  // Escape
            '\\x1b[A': '\x1b[A',  // Up
            '\\x1b[B': '\x1b[B',  // Down
            '\\x1b[C': '\x1b[C',  // Right
            '\\x1b[D': '\x1b[D',  // Left
            '\\r': '\r',          // Enter
        };

        document.querySelectorAll('.ctrl-btn').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const rawInput = btn.getAttribute('data-input');
                const input = INPUT_MAP[rawInput];
                if (input) {
                    sendInput(input);
                }
            });
        });

        // Paste input bar
        const pasteInput = document.getElementById('paste-input');
        const sendBtn = document.getElementById('send-btn');

        function sendPasteInput() {
            const text = pasteInput.value;
            if (text) {
                sendInput(text);
                pasteInput.value = '';
            }
        }

        sendBtn.addEventListener('click', (e) => {
            e.preventDefault();
            sendPasteInput();
        });

        pasteInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendPasteInput();
            }
        });

        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        // Text staged by putOnClipboard() when no automated path was allowed;
        // completed by the status-bar click handler below, on a real user
        // gesture. Declared here because setStatus() clears it.
        let pendingClipboardText = null;
        const clipboardBtn = document.getElementById('clipboard-btn');
        const clipboardAnnouncer = document.getElementById('clipboard-announcer');

        function setStatus(message, type = '', persistent = false) {
            // Deliberately does NOT touch pendingClipboardText any more. It used
            // to clear it, because the staged copy and its "tap here" affordance
            // both lived in this one status line and an unrelated message would
            // orphan the text. The staged copy now belongs to the clipboard
            // button, which owns its own lifetime -- clearing it from here would
            // leave the button lit with nothing behind it.
            status.textContent = message;
            status.className = type;
            if (message && !persistent) {
                setTimeout(() => setStatus(''), 5000);
            }
        }

        // ========================================
        // Clipboard delivery (OSC 52)
        // ========================================

        // Put text on the user's clipboard, degrading through three strategies.
        // The bug this whole change fixes was a clipboard path that silently did
        // nothing for years, so the last step must always be user-visible.
        //
        // An EMPTY string is honored rather than discarded: OSC 52 uses it to
        // mean "clear the clipboard", which is a legitimate request. Only a
        // non-string (which decodeOsc52 never produces for a write) is ignored.
        // Both write strategies, in order. Shared by the OSC 52 path (no user
        // activation) and the tap-to-copy path (real activation) — the tap MUST
        // run this whole chain, not just strategy 1: on the plain HTTP :7680
        // port navigator.clipboard does not exist, so a tap that only tried it
        // would fail for the same reason the automatic attempt did, leaving the
        // "always works" last resort unable to ever succeed there.
        //
        // VERIFICATION GAP: the ingress (HTTPS) path is verified end to end in a
        // real browser; the plain-HTTP path is NOT. http://localhost counts as a
        // secure origin, so a local container cannot reproduce an insecure one —
        // testing it needs the add-on reached over the LAN by IP. Accepted and
        // documented (see DOCS.md "Clipboard (OSC 52)"). If you change this
        // chain, re-check it over http://<host-ip>:7680, not localhost.
        async function tryClipboardWrite(text) {
            // 1. Async Clipboard API — needs HTTPS (ingress) and often a gesture.
            // On an insecure origin navigator.clipboard is undefined, so this
            // throws synchronously and consumes no user activation.
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch { /* fall through */ }

            // 2. execCommand fallback — the only path that can work on the plain
            // HTTP :7680 port. It copies the current SELECTION, so it needs a
            // selection to exist: hence the offscreen textarea. Skipped for an
            // empty write, which execCommand cannot express.
            if (text !== '') {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.setAttribute('readonly', '');
                    ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
                    document.body.appendChild(ta);
                    ta.select();
                    const ok = document.execCommand('copy');
                    ta.remove();
                    if (ok) return true;
                } catch { /* fall through */ }
            }

            return false;
        }

        // Announce a copy on the clipboard button rather than in the status bar.
        //
        // The status text auto-cleared after five seconds, so a copy that
        // arrived while the user was reading the terminal disappeared with no
        // trace and no way to retrieve it. The button's indicator persists
        // until acknowledged, which is the whole point of moving it.
        //
        // The text is staged even when the automatic write already succeeded.
        // On a secure origin (ingress) it has; on the plain :7680 port
        // navigator.clipboard does not exist and the click is the only path
        // that can work. Staging in both cases means the button behaves
        // identically either way, and a click is at worst a harmless re-write.
        async function putOnClipboard(text) {
            if (typeof text !== 'string') return;
            pendingClipboardText = text;
            markClipboardUnread(text);
            // Try the automatic path anyway: when it works the text is already
            // on the clipboard and the button is pure notification.
            await tryClipboardWrite(text);
        }

        function markClipboardUnread(text) {
            clipboardBtn.classList.add('has-copy');
            const label = text === ''
                ? 'Clipboard clear staged — click to apply'
                : 'Copied — click to place on your clipboard';
            clipboardBtn.title = label;
            // aria-label as well as title: title is announced inconsistently
            // and is undiscoverable by touch, and the icon is aria-hidden, so
            // without this the button has no accessible name at all.
            clipboardBtn.setAttribute('aria-label', `Clipboard: ${label}`);
            clipboardAnnouncer.textContent = label;
            // Restart the animation even if a previous flash is still running,
            // so back-to-back copies each register visibly.
            clipboardBtn.classList.remove('flash');
            void clipboardBtn.offsetWidth;
            clipboardBtn.classList.add('flash');
        }

        // Drop the flash class when it finishes so the next copy can re-add it
        // and re-trigger the animation. The badge is what persists.
        clipboardBtn.addEventListener('animationend', () =>
            clipboardBtn.classList.remove('flash'));

        // The one place with genuine user activation, and therefore the only
        // place execCommand can work on the plain :7680 port.
        //
        // Clearing pendingClipboardText before awaiting means a double-click
        // cannot fire two writes. The null check (rather than a truthiness
        // check) keeps a staged empty "clear the clipboard" write working.
        // Clearing the indicator is unconditional: it means "you have seen
        // this", and leaving it lit after a click would be unresolvable.
        clipboardBtn.addEventListener('click', async () => {
            if (pendingClipboardText === null) return;
            const text = pendingClipboardText;
            pendingClipboardText = null;
            clipboardBtn.classList.remove('has-copy');
            clipboardBtn.title = 'Nothing copied yet';
            clipboardBtn.setAttribute('aria-label', 'Clipboard: nothing copied yet');
            // Emptied rather than given an "acknowledged" message: the user just
            // clicked, so they know. Announcing it again would be chatter.
            clipboardAnnouncer.textContent = '';
            if (!await tryClipboardWrite(text)) {
                setStatus('Clipboard unavailable — use Shift+drag to copy', 'error');
            }
        });

        async function uploadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                setStatus('Please select an image file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            uploadBtn.innerHTML = '<span class="spinner"></span><span>Uploading...</span>';
            uploadBtn.disabled = true;

            try {
                // Use relative path for Home Assistant ingress compatibility
                const response = await fetch('upload', {
                    method: 'POST',
                    body: formData
                });

                // Check if response is ok (status 200-299)
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Upload failed';
                    try {
                        const errorJson = JSON.parse(text);
                        errorMessage = errorJson.error || errorMessage;
                    } catch {
                        errorMessage = text || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.success) {
                    const filePath = result.path;
                    console.log('Image uploaded:', filePath);

                    // Try injecting path directly into terminal, fall back to clipboard
                    if (!injectIntoTerminal(filePath)) {
                        const copied = await copyToClipboard(filePath);
                        if (copied) {
                            setStatus('Copied path: ' + filePath + ' — paste in terminal', 'success');
                        } else {
                            setStatus('Path: ' + filePath, 'success', true);
                        }
                    }
                } else {
                    setStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                setStatus('Upload failed: ' + error.message, 'error');
            } finally {
                uploadBtn.innerHTML = '<span>📎</span><span>Upload Image</span>';
                uploadBtn.disabled = false;
            }
        }

        // Upload button click
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadImage(e.target.files[0]);
            }
        });

        // Paste handling
        document.addEventListener('paste', async (e) => {
            console.log('Paste event detected');
            const items = e.clipboardData?.items;

            if (!items) {
                console.log('No clipboard items found');
                return;
            }

            console.log('Clipboard items:', Array.from(items).map(i => i.type));

            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    console.log('Image found in clipboard:', item.type);
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        console.log('File extracted from clipboard:', file.name, file.size);
                        await uploadImage(file);
                    } else {
                        console.error('Failed to extract file from clipboard item');
                    }
                    break;
                }
            }
        });

        // Also handle paste on window for better compatibility
        window.addEventListener('paste', async (e) => {
            // This ensures paste works even when iframe has focus
            console.log('Window paste event detected');
        });

        // Drag and drop handling
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            const files = e.dataTransfer?.files;
            if (files && files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    await uploadImage(file);
                } else {
                    setStatus('Please drop an image file', 'error');
                }
            }
        });

        // Helper to copy text to clipboard
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback:', err);
                    return fallbackCopyToClipboard(text);
                }
            } else {
                return fallbackCopyToClipboard(text);
            }
        }

        // Fallback clipboard copy using execCommand
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'absolute';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                const copied = document.execCommand('copy');
                document.body.removeChild(textArea);
                return copied;
            } catch (err) {
                document.body.removeChild(textArea);
                return false;
            }
        }

        // ========================================
        // Login Link Assistant (see login-link.js)
        // ========================================
        (function () {
            const banner = document.getElementById('login-banner');
            const msgEl = document.getElementById('login-banner-msg');
            const openEl = document.getElementById('login-open');
            const copyEl = document.getElementById('login-copy');
            const pasteEl = document.getElementById('login-paste');
            const sendEl = document.getElementById('login-send');
            const dismissEl = document.getElementById('login-dismiss');
            const rescanEl = document.getElementById('login-rescan');

            let currentUrl = null;      // URL shown in the banner
            let dismissedUrl = null;    // URL the user dismissed (don't re-nag)
            let pasteArmed = false;     // leg-2 prompt seen → focus the field

            function getTerm() {
                const iframe = document.getElementById('terminal-frame');
                try { return iframe.contentWindow?.term || null; } catch { return null; }
            }

            // Read the visible rows + a bounded slice of scrollback (~200 rows).
            function readRows(term) {
                const buf = term.buffer?.active;
                if (!buf) return [];
                const end = buf.baseY + term.rows;          // exclusive
                const start = Math.max(0, end - 200);
                const rows = [];
                for (let y = start; y < end; y++) {
                    const line = buf.getLine(y);
                    rows.push(line ? line.translateToString(true) : '');
                }
                return rows;
            }

            function showLink(url) {
                currentUrl = url;
                pasteArmed = false;       // re-arm paste messaging/focus for this flow
                openEl.href = url;
                msgEl.textContent = 'Login link ready';
                pasteEl.hidden = false;   // available as soon as the link appears
                sendEl.hidden = false;
                banner.hidden = false;
            }

            function armPaste() {
                if (banner.hidden) return;
                if (!pasteArmed) {
                    pasteArmed = true;
                    msgEl.textContent = 'Paste your authentication code below';
                    try { pasteEl.focus(); } catch { /* focus may fail; non-fatal */ }
                }
            }

            function scan() {
                const term = getTerm();
                if (!term || !window.LoginLink) return;
                const rows = readRows(term);
                // Pass term.cols so the reconstructor can tell a genuine wrap
                // (row filled to the terminal width) from a complete short URL.
                const url = window.LoginLink.reconstructLoginUrl(rows, term.cols);
                if (url && url !== dismissedUrl && url !== currentUrl) {
                    showLink(url);
                }
                if (window.LoginLink.isPasteBackPrompt(rows.join('\n'))) {
                    armPaste();
                }
            }

            // Debounce so bursts of output trigger one scan.
            let scanTimer = null;
            function scheduleScan() {
                if (scanTimer) return;
                scanTimer = setTimeout(() => { scanTimer = null; scan(); }, 150);
            }

            // Hook onWriteParsed once term is ready; fall back to polling.
            let hooked = false;
            const readyPoll = setInterval(() => {
                const term = getTerm();
                if (!term) return;
                if (term.onWriteParsed && !hooked) {
                    term.onWriteParsed(scheduleScan);
                    hooked = true;
                    clearInterval(readyPoll);
                }
            }, 500);
            // Safety-net poll regardless of hook (cheap; bounded row read).
            setInterval(scan, 1500);

            copyEl.addEventListener('click', async () => {
                if (!currentUrl) return;
                const ok = await copyToClipboard(currentUrl);
                setStatus(ok ? 'Login link copied' : 'Copy failed', ok ? 'success' : 'error');
            });
            sendEl.addEventListener('click', () => {
                const val = pasteEl.value.trim();
                if (!val) return;
                // SECURITY: token-bearing — use sendInput() directly, NOT
                // injectIntoTerminal() (which echoes the text into the status line).
                // Never log `val`.
                if (sendInput(val)) {
                    // Submit Enter as a SEPARATE, slightly delayed keystroke.
                    // Sending "code\r" in one burst lets the terminal's paste
                    // handling treat the newline as pasted text rather than a
                    // submit — so the code lands but never submits. A distinct,
                    // delayed \r reads as a real Enter/Return.
                    setTimeout(() => sendInput('\r'), 60);
                    pasteEl.value = '';   // clear only on success so the user can retry
                    setStatus('Code sent', 'success');
                }
                // On failure sendInput() already set an error status; leave the field intact.
            });
            pasteEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); sendEl.click(); }
            });
            dismissEl.addEventListener('click', () => {
                dismissedUrl = currentUrl;
                currentUrl = null;
                pasteArmed = false;
                banner.hidden = true;
            });
            rescanEl.addEventListener('click', () => {
                dismissedUrl = null; // allow re-surfacing after a manual scan
                scan();
                if (banner.hidden) setStatus('No login link found on screen', 'error');
            });
        })();

        // Prevent default drag behavior on iframe
        window.addEventListener('load', () => {
            const iframe = document.getElementById('terminal-frame');
            iframe.addEventListener('dragover', (e) => e.preventDefault());
            iframe.addEventListener('drop', (e) => e.preventDefault());
        });

        // ========================================
        // iOS Touch-to-Scroll for Terminal
        // ========================================
        // iOS doesn't deliver touch events to iframes in PWA standalone mode.
        // The overlay is always active on touch devices (pointer-events: auto
        // via display:block). It captures all touches in the terminal area:
        //   - Vertical swipes → scroll the terminal via WheelEvent + scrollLines
        //   - Taps → focus xterm's hidden textarea to open iOS keyboard
        // iOS keyboard requires focus() on a real input element from a user
        // gesture handler — the overlay's touchend qualifies as a user gesture.

        (function() {
            const overlay = document.getElementById('touch-scroll-overlay');
            if (!overlay) return;

            let startY = 0;
            let startX = 0;
            let lastY = 0;
            let isSwiping = false;
            let touchStartTime = 0;
            const SWIPE_THRESHOLD = 10;
            const LINE_HEIGHT = 20;

            overlay.addEventListener('touchstart', (e) => {
                startY = lastY = e.touches[0].clientY;
                startX = e.touches[0].clientX;
                isSwiping = false;
                touchStartTime = Date.now();
            }, { passive: true });

            overlay.addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const currentX = e.touches[0].clientX;
                const totalDeltaY = Math.abs(currentY - startY);
                const totalDeltaX = Math.abs(currentX - startX);

                // Only handle vertical swipes
                if (!isSwiping && totalDeltaY > SWIPE_THRESHOLD && totalDeltaY > totalDeltaX) {
                    isSwiping = true;
                }

                if (!isSwiping) return;

                e.preventDefault();

                const deltaY = lastY - currentY;
                lastY = currentY;

                const lines = Math.round(deltaY / LINE_HEIGHT);
                if (lines === 0) return;

                const iframe = document.getElementById('terminal-frame');
                try {
                    const term = iframe.contentWindow?.term;
                    if (!term) return;

                    // Dispatch wheel event on xterm viewport (works with tmux mouse mode)
                    const xtermViewport = iframe.contentDocument?.querySelector('.xterm-viewport');
                    if (xtermViewport) {
                        xtermViewport.dispatchEvent(new WheelEvent('wheel', {
                            deltaY: lines * LINE_HEIGHT,
                            deltaMode: 0,
                            bubbles: true,
                            cancelable: true
                        }));
                    }

                    // Also scroll xterm.js buffer directly (fallback for mouse mode off)
                    term.scrollLines(lines);
                } catch (err) {
                    // Cross-origin or term not ready
                }
            }, { passive: false });

            overlay.addEventListener('touchend', (e) => {
                if (isSwiping) return; // Was a scroll, not a tap

                const elapsed = Date.now() - touchStartTime;
                if (elapsed > 300) return; // Long press, not a tap

                // Tap detected — focus xterm's hidden textarea to open keyboard.
                // This runs inside a user gesture handler (touchend on overlay),
                // so iOS treats the focus() call as user-initiated and opens the keyboard.
                const iframe = document.getElementById('terminal-frame');
                try {
                    const xtermTextarea = iframe.contentDocument?.querySelector('.xterm-helper-textarea');
                    if (xtermTextarea) {
                        xtermTextarea.focus();
                    } else {
                        // Fallback: focus the iframe itself
                        iframe.focus();
                    }
                } catch (err) {
                    iframe.focus();
                }
            });
        })();

        // ========================================
        // iOS Virtual Keyboard Height Fix
        // ========================================
        // iOS doesn't resize the layout viewport when the keyboard opens —
        // 100vh still equals full screen height, hiding the terminal bottom.
        // Use the Visual Viewport API to set a CSS custom property (--app-height)
        // that tracks the actual visible height.

        (function() {
            const vv = window.visualViewport;
            if (!vv) return; // Not supported, 100vh fallback works fine

            function updateHeight() {
                document.documentElement.style.setProperty('--app-height', vv.height + 'px');
            }

            vv.addEventListener('resize', updateHeight);
            // Set initial value
            updateHeight();
        })();

        // ========================================
        // Voice Input with Web Speech API
        // ========================================

        const voiceBtn = document.getElementById('voice-btn');
        const voiceModal = document.getElementById('voice-modal');
        const voiceRecordBtn = document.getElementById('voice-record-btn');
        const voiceCopyBtn = document.getElementById('voice-copy-btn');
        const voiceSendBtn = document.getElementById('voice-send-btn');
        const voiceCloseBtn = document.getElementById('voice-close-btn');
        const voiceTranscript = document.getElementById('voice-transcript');
        const voiceStatus = document.getElementById('voice-status');

        let recognition = null;
        let isRecording = false;

        // Check if Web Speech API is supported
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // Default to English, can be made configurable

            console.log('Web Speech API is supported!');
        } else {
            console.warn('Web Speech API is not supported in this browser');
            voiceBtn.disabled = true;
            voiceBtn.title = 'Voice input not supported in this browser';
        }

        // Open voice modal
        voiceBtn.addEventListener('click', () => {
            voiceModal.classList.add('active');
            voiceTranscript.textContent = '';
            voiceStatus.textContent = '';
            voiceCopyBtn.style.display = 'none';
            voiceSendBtn.style.display = 'none';
        });

        // Close voice modal
        voiceCloseBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            }
            voiceModal.classList.remove('active');
        });

        // Click outside modal to close
        voiceModal.addEventListener('click', (e) => {
            if (e.target === voiceModal) {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }
        });

        // Start/Stop recording
        voiceRecordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        function startRecording() {
            if (!recognition) {
                voiceStatus.textContent = '❌ Speech recognition not available';
                voiceStatus.className = 'error';
                return;
            }

            isRecording = true;
            voiceRecordBtn.textContent = 'Stop Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-danger';
            voiceStatus.textContent = '🎤 Listening... (speak now)';
            voiceStatus.classList.add('listening');
            voiceTranscript.classList.add('listening');

            let finalTranscript = '';
            let interimTranscript = '';

            recognition.onresult = (event) => {
                interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Display both final and interim results
                voiceTranscript.textContent = finalTranscript + interimTranscript;

                // Auto-scroll to bottom
                voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMessage = 'Error: ';

                switch(event.error) {
                    case 'no-speech':
                        errorMessage += 'No speech detected. Try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMessage += 'No microphone found. Check your settings.';
                        break;
                    case 'not-allowed':
                        errorMessage += 'Microphone access denied. Please allow access.';
                        break;
                    default:
                        errorMessage += event.error;
                }

                voiceStatus.textContent = '❌ ' + errorMessage;
                voiceStatus.classList.remove('listening');
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Restart if it stops but we're still recording
                    recognition.start();
                }
            };

            try {
                recognition.start();
                console.log('Speech recognition started');
            } catch (err) {
                console.error('Failed to start recognition:', err);
                voiceStatus.textContent = '❌ Failed to start recording';
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!recognition) return;

            isRecording = false;
            recognition.stop();

            voiceRecordBtn.textContent = 'Start Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-primary';
            voiceStatus.textContent = '✓ Recording stopped';
            voiceStatus.classList.remove('listening');
            voiceTranscript.classList.remove('listening');

            if (voiceTranscript.textContent.trim()) {
                voiceSendBtn.style.display = 'inline-block';
                voiceCopyBtn.style.display = 'inline-block';
                voiceStatus.textContent = 'Transcript ready! Edit if needed, then send or copy.';
            }

            console.log('Speech recognition stopped');
        }

        // Send transcript to terminal
        voiceSendBtn.addEventListener('click', () => {
            const text = voiceTranscript.textContent.trim();
            if (!text) {
                voiceStatus.textContent = 'No text to send';
                return;
            }
            if (sendInput(text)) {
                voiceStatus.textContent = 'Sent to terminal!';
                voiceStatus.className = 'success';
            } else {
                voiceStatus.textContent = 'Terminal not ready. Use Copy Text instead.';
            }
        });

        // Copy transcript to clipboard
        voiceCopyBtn.addEventListener('click', async () => {
            const text = voiceTranscript.textContent.trim();

            if (!text) {
                voiceStatus.textContent = '❌ No text to copy';
                return;
            }

            // Try clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    voiceStatus.textContent = '✓ Copied to clipboard! Paste into terminal.';
                    voiceStatus.className = 'success';
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
        });

        function fallbackCopy(text) {
            // Fallback using execCommand
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            tempTextArea.style.position = 'absolute';
            tempTextArea.style.left = '-9999px';
            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            try {
                const copied = document.execCommand('copy');
                if (copied) {
                    voiceStatus.textContent = '✓ Copied! Paste into terminal.';
                    voiceStatus.className = 'success';
                } else {
                    voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
                }
            } catch (err) {
                voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
            }

            document.body.removeChild(tempTextArea);
        }

        // Keyboard shortcuts in voice modal
        voiceModal.addEventListener('keydown', (e) => {
            // Escape to close
            if (e.key === 'Escape') {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }

            // Enter to send to terminal (if text exists and not recording)
            if (e.key === 'Enter' && !isRecording && voiceTranscript.textContent.trim()) {
                voiceSendBtn.click();
            }

            // Space to start/stop recording (if not editing transcript)
            if (e.key === ' ' && e.target !== voiceTranscript) {
                e.preventDefault();
                voiceRecordBtn.click();
            }
        });

        console.log('Voice input module loaded');
    </script>

            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered, scope:', reg.scope))
                .catch(err => console.warn('SW registration failed:', err));
        }
    </script>
</body>
</html>
