---
name: "Claude Terminal Prowine"
description: "Enhanced terminal interface for Anthropic's Claude Code CLI with persistent auth, package management, and file uploads"
version: "2.11.2" # bumped by publish.yml once the image is live
slug: "claude_terminal_prowine"
image: "ghcr.io/owine/claude-terminal-prowine"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64

# External resources
url: "https://github.com/owine/claude-terminal-home-assistant"

# Web interface configuration
ingress: true
ingress_port: 7680
# Pass POST bodies through instead of buffering them. Buffered, the Supervisor
# reads the whole body first and refuses anything over its 16 MiB request cap
# with a 413 before the wrapper sees it - well under upload_max_mb's 25 MB
# default. Streamed bodies arrive chunked, without Content-Length; the upload
# route counts bytes as they come (files-upload.js), so it needs neither.
ingress_stream: true
panel_icon: mdi:code-braces-box
panel_title: "Claude Terminal Prowine"
panel_admin: true

# Port configuration
#
# 7680 defaults to null - unpublished - so the only route in is ingress, which
# Home Assistant authenticates. ttyd (7681) is not listed: it binds the
# container's loopback and is reachable only through the wrapper. Nothing in this app authenticates a direct
# connection: the web UI proxies straight through to `ttyd --writable` attached
# to a root tmux session with /config, /share and (when enabled) the host
# Docker socket. Publishing 7680 therefore hands a root terminal to anyone who
# can reach the host on that port. (The wrapper does refuse WebSocket
# connections opened by other websites, so a page a LAN user visits cannot
# drive the terminal through their browser.)
#
# Assigning a host port in the app's Network tab is the opt-in, and is what
# the PWA-over-a-stable-URL setup in DOCS.md needs. Put it behind an
# authenticating reverse proxy if it leaves the LAN. The Network tab's warning
# lives in translations/en.yaml (network), which replaced ports_description.
ports:
  7680/tcp: null

# App configuration options. Their labels and help text in the Configuration
# tab come from translations/en.yaml - add an entry there with each new option.
options:
  auto_launch_claude: true
  dangerously_skip_permissions: false
  enable_ha_mcp: true
  # working_directory: Directory the terminal session starts in.
  #   Empty (default) means /config, which is where the container already
  #   started. A path that does not exist warns in the log and falls back to
  #   /config rather than failing - a typo must not take the terminal down.
  working_directory: ""
  # claude_code_oauth_token: Non-interactive auth. Generate with
  #   `claude setup-token` on a machine where you are already logged in, then
  #   paste it here to skip the browser OAuth flow entirely. Masked in the UI
  #   and never written to the log. Leave empty to log in interactively.
  #   Note: token auth cannot establish Remote Control sessions.
  claude_code_oauth_token: ""
  # login_notification: Post Claude's login link as a Home Assistant
  #   notification (also reaches the Companion app) while a browser login is
  #   waiting, and dismiss it once the login succeeds. Skipped when
  #   claude_code_oauth_token is set.
  login_notification: true
  # tmux_mouse_mode: Enable mouse support in tmux
  #   When true (default): the wheel scrolls tmux history and a drag selects and
  #     copies. To select with the terminal's own selection instead, hold Shift
  #     (Option on macOS) while dragging - that works in either setting
  #   When false: no mouse reporting at all; the wheel sends arrow keys to
  #     full-screen apps. Scroll history with Ctrl+B, [
  #   Flip it live with Prefix + m
  tmux_mouse_mode: true
  # persist_npm_cache: Keep the npm cache in persistent /data storage
  #   When false: cache lives in ephemeral /tmp, wiped on restart and kept out
  #     of HA backups (default) - the ~3 GB cache no longer bloats backups
  #   When true: cache persists at /data/home/.npm across restarts (legacy
  #     behavior); useful on slow connections to avoid re-downloading packages
  persist_npm_cache: false
  # image_retention_days: Pasted and dropped images older than this are
  #   deleted at startup (only the app's own pasted-* files in /data/images).
  #   0 keeps them forever. /data is in every HA backup, so this bounds both.
  image_retention_days: 30
  # upload_max_mb: Largest file the Files sidebar uploads into /config, in
  #   megabytes, at most 1024. Pasted and dropped images keep their own
  #   10 MB limit.
  upload_max_mb: 25
  # upload_retention_days: Files in the sidebar's inbox, /config/uploads,
  #   last modified more than this many days ago are deleted at startup:
  #   every file at its top level, whoever put it there. 0 keeps them
  #   forever; at most 36500. A folder chosen with "Upload here" is never
  #   swept.
  upload_retention_days: 30
  persistent_apk_packages: []
  persistent_pip_packages: []
  # init_commands: Shell commands run as root, in order, on every start - after
  #   packages and the Docker CLI are installed, before the terminal. Each
  #   shell gets 120 seconds (programs it started may outlive it); start
  #   services in the background with their output redirected
  #   (nohup cmd > file.log 2>&1 &).
  #   Command and output go to the app log, and a failing command only warns.
  init_commands: []
  enable_docker: false
  enable_docker_buildx: false

schema:
  auto_launch_claude: bool?
  dangerously_skip_permissions: bool?
  enable_ha_mcp: bool?
  working_directory: str?
  claude_code_oauth_token: password?
  login_notification: bool?
  tmux_mouse_mode: bool?
  persist_npm_cache: bool?
  image_retention_days: int(0,)?
  upload_max_mb: int(1,1024)?
  upload_retention_days: int(0,36500)?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  init_commands:
    - str?
  enable_docker: bool?
  enable_docker_buildx: bool?

# Left out of HA backups: everything here is rebuilt or downloaded again.
# Supervisor tests each pattern with PurePath.match against the file's full
# path, which matches from the right, so each one is anchored on the data
# folder - whose name ends in the slug - to keep it from matching elsewhere.
# Supervisor marks full-path matching as legacy; if it moves to relative
# paths these stop matching, which fails safe (backups just grow again).
#   .cache: XDG_CACHE_HOME, caches only
#   home/.claude/cache: Claude Code's own cache
#   home/.local/bin/claude, .local/share/claude/versions: the Claude binary.
#     run.sh copies the image's one in at startup when the launcher is
#     missing, and Claude's self-update replaces it with a link into
#     versions/. Excluded together, so a restore never brings back a link
#     without its target - about 250 MB per backup.
backup_exclude:
  - "*_claude_terminal_prowine/.cache"
  - "*_claude_terminal_prowine/home/.claude/cache"
  - "*_claude_terminal_prowine/home/.local/bin/claude"
  - "*_claude_terminal_prowine/.local/share/claude/versions"

# Volume mappings for file access
map:
  # path: /config keeps HA's config dir at today's mount (drop-in for legacy "config:rw")
  - type: homeassistant_config
    read_only: false
    path: /config
  # all_app_configs exposes every app's config dir at /addon_configs/<repo>_<slug>/.
  # It replaced all_addon_configs in Supervisor 2026.07, and mounts at
  # /app_configs by default; path: keeps the mount where all_addon_configs put
  # it, which DOCS.md and users' working_directory settings name.
  # Always-on read-write; see DOCS.md "App Config Access".
  - type: all_app_configs
    read_only: false
    path: /addon_configs
  # share exposes /share, the folder Home Assistant and other apps use to
  # exchange files. Read-write so Claude can work on files placed there - a
  # natural home for projects that are not Home Assistant configuration.
  - type: share
    read_only: false

# API access for Home Assistant integration
# hassio_api + role manager: the Supervisor endpoints used for add-on and host
#   information; /addons needs manager, /core/info and /host/info need default
# homeassistant_api: the /core/api/* proxy used by ha-mcp
# Deliberately NOT auth_api: it grants only http://supervisor/auth, which
#   validates a Home Assistant username and password. Nothing here calls it.
hassio_api: true
hassio_role: manager
homeassistant_api: true
# Docker socket access (inert while Protection Mode is ON).
# Lets the terminal talk to the host Docker daemon when the user disables
# Protection Mode AND sets enable_docker: true. See DOCS.md "Docker Access".
docker_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7680]/
