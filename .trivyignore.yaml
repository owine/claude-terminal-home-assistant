  # --- usr/bin/ha (Home Assistant CLI) ---
  # Go stdlib, x/net and x/text CVEs compiled into the ha-cli binary. HA_CLI_VERSION
  # is pinned to 5.5.0, the latest release (2026-09-03), built on go1.26.7 with
  # x/net 0.55.0 and x/text 0.37.0, so there is nothing to bump to. Needs an
  # upstream ha-cli rebuild on go >= 1.26.9 with x/net >= 0.60.0 and
  # x/text >= 0.41.0.
  - id: CVE-2026-46600
    paths:
