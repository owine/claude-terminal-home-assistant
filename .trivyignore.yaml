---
# Trivy vulnerability ignore list.
#
# Every entry below is a real, fixed-upstream CVE that this repo cannot remediate
# on its own - the fix lives in a binary we don't compile (a new HA base image for
# tempio, a new ha-cli release for ha, a new gh release for gh) or behind a
# dependency cap we don't control. Review periodically and prune each entry when
# its stated condition is met.
#
# Entries are scoped with `paths` (matched against the scan target) or `purl` so a
# suppression can never leak to an unrelated component. NOTE: Trivy does not
# auto-discover this file - only the plain `.trivyignore` name is picked up by
# default - so both security.yml and publish.yml must pass it explicitly via the
# action's `trivyignores:` input.
#
# Regenerating: extract each binary and scan it standalone rather than trusting a
# CI log - the log is a snapshot against the Trivy DB of that day and goes stale.
# See the repo notes for the extract-and-scan method.

vulnerabilities:
  # --- usr/bin/tempio (Home Assistant base image templating binary) ---
  # Go stdlib and x/crypto CVEs in tempio, the templating binary baked into the
  # Home Assistant base image. Not fixable here - tempio is not an apk package and
  # is not recompiled by this add-on; only a new HA base image release can resolve
  # these. Verified 2026-08-19 against base:3.24 digest 93ef607, which rebuilt
  # tempio on go1.26.5 (up from go1.23.3) and x/crypto 0.31.0 - that bump retired
  # 16 previously-listed CVEs, pruned here. The stdlib entries below need
  # go >= 1.26.6; the x/crypto entries need x/crypto >= 0.52.0. Re-scan and prune
  # when the base image is bumped again.
  - id: CVE-2025-22869
    paths:
