---
# Trivy vulnerability ignore list.
#
# Every vulnerability entry below is a real, fixed-upstream CVE this repo cannot remediate
# on its own - the fix lives in a binary we don't compile (a new ha-cli release
# for ha, a new gh release for gh) or behind a dependency cap we don't control. Review periodically and prune each entry when
# its stated condition is met.
#
# Entries are scoped with `paths` (matched against the scan target) or `purl` so a
# suppression can never leak to an unrelated component. NOTE: Trivy does not
# auto-discover this file - only the plain `.trivyignore` name is picked up by
# default - so both security.yml and publish.yml must pass it explicitly via the
# action's `trivyignores:` input.
#
# Regenerating: extract each binary and scan it standalone rather than trusting a
# CI log - the log is a snapshot against the Trivy DB of that day and goes stale.
# See the repo notes for the extract-and-scan method.

vulnerabilities:
  # usr/bin/tempio needs no entries: the Dockerfile deletes it (nothing runs it).
  # usr/bin/gh (GitHub CLI) needs no entries: gh 2.103.2 scans clean (2026-10-28).

  # --- usr/bin/ha (Home Assistant CLI) ---
  # Go stdlib, x/net and x/text CVEs compiled into the ha-cli binary. HA_CLI_VERSION
  # is pinned to 5.6.0, the latest release (2026-10-20), built on go1.26.9 with
  # x/net 0.55.0 and x/text 0.37.0, so there is nothing to bump to. Needs an
  # upstream ha-cli rebuild on go >= 1.26.10 with x/net >= 0.60.0 and
  # x/text >= 0.41.0. (go1.26.9 retired CVE-2026-78667 and -97031 here.)
  - id: CVE-2026-46600
    paths:
      - "usr/bin/ha"
  - id: CVE-2026-56851
    paths:
      - "usr/bin/ha"
  - id: CVE-2026-56852
    paths:
      - "usr/bin/ha"
  - id: CVE-2026-78669
    paths:
      - "usr/bin/ha"
  - id: CVE-2026-111943
    paths:
      - "usr/bin/ha"

# Misconfiguration (IaC) findings. Unlike the CVEs above, these are deliberate
# design choices and not waiting on an upstream fix, so there is nothing to prune.
misconfigurations:
  # DS-0002: "Specify at least 1 USER command in Dockerfile with non-root user".
  # Home Assistant add-ons run as root by design. The image boots through the HA
  # base image's s6-overlay init and bashio, run.sh installs packages with apk
  # through persist-install, and the optional Docker socket feature needs root.
  # The Supervisor's AppArmor profile and container isolation provide the
  # sandboxing. Scoped to the add-on Dockerfile, so a new Dockerfile elsewhere
  # still gets checked.
  - id: DS-0002
    paths:
      - "claude-terminal/Dockerfile"
