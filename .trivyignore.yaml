  # --- usr/bin/gh (GitHub CLI) ---
  # Go stdlib and x/net CVEs compiled into the gh binary. GH_CLI_VERSION is pinned
  # to 2.102.0, the latest release (2026-09-30), built on go1.27.1 with x/net
  # 0.58.0 - before the 2026-10 Go security batch - so there is nothing to bump
  # to. Needs an upstream cli/cli rebuild on go >= 1.27.2 with x/net >= 0.60.0.
  - id: CVE-2026-78667
    paths:
      - "usr/bin/gh"
  - id: CVE-2026-78669
    paths:
      - "usr/bin/gh"
  - id: CVE-2026-97031
    paths:
      - "usr/bin/gh"

# Misconfiguration (IaC) findings. Unlike the CVEs above, these are deliberate
# design choices and not waiting on an upstream fix, so there is nothing to prune.
misconfigurations:
  # DS-0002: "Specify at least 1 USER command in Dockerfile with non-root user".
  # Home Assistant add-ons run as root by design. The image boots through the HA
  # base image's s6-overlay init and bashio, run.sh installs packages with apk
  # through persist-install, and the optional Docker socket feature needs root.
  # The Supervisor's AppArmor profile and container isolation provide the
  # sandboxing. Scoped to the add-on Dockerfile, so a new Dockerfile elsewhere
  # still gets checked.
  - id: DS-0002
    paths:
      - "claude-terminal/Dockerfile"
